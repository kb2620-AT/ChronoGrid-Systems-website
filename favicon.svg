<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0D1B2E"/>
  <!-- Teal border -->
  <rect width="32" height="32" rx="6" fill="none" stroke="#17A589" stroke-width="1.5"/>
  <!-- CG text top -->
  <text x="16" y="13" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#17A589" text-anchor="middle" letter-spacing="1">CG</text>
  <!-- Divider -->
  <line x1="6" y1="16.5" x2="26" y2="16.5" stroke="#17A589" stroke-width=".5" opacity=".4"/>
  <!-- Clock circle -->
  <circle cx="16" cy="24" r="5.5" fill="none" stroke="#17A589" stroke-width="1.2"/>
  <!-- Minute hand → 12 o'clock -->
  <line x1="16" y1="24" x2="16" y2="19.5" stroke="#C8A951" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Hour hand → 3 o'clock -->
  <line x1="16" y1="24" x2="19.5" y2="24" stroke="#E8EDF4" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <!-- Center dot -->
  <circle cx="16" cy="24" r="1" fill="#C8A951"/>
</svg>
